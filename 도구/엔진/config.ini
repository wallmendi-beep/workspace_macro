[Hotkeys]
; 시스템 단축키와 충돌하면 여기를 고쳐서 커스텀하세요 (AutoHotkey 키 이름 사용)
Trigger=^!r
PauseKey=Pause
ResumeKey=ScrollLock
HomeKey=Home
EndKey=End
NextSectionKey=PgUp
PrevSectionKey=PgDn
; Esc는 등기 시스템과 충돌 위험이 있어 의도적으로 할당하지 않습니다

[Playback]
; 1 = 모의 모드(실제 입력 없음, 로그만) — 처음 테스트는 반드시 이 상태로
DryRun=1
; 1 = 붙여넣기(Ctrl+V), 0 = 타이핑
PasteMethod=1
; 클립 기본 간격(밀리초)
DefaultIntervalMs=2000
; 종료/정지 시 원래 창 위치 및 크기 복원 (1=복원, 0=유지)
RestoreWindowOnStop=1

[Target]
; 대상 등기 시스템 창 식별 규칙 (제목/클래스/실행파일명)
; 비어있으면 실행 시 활성화된 Foreground 창을 확인창으로 검증합니다
WinTitle=
WinClass=
WinExe=

[Display]
; 스케일링 모드: off (고정 픽셀 원본 origin 매핑), ratio (비율 확대/축소)
ScaleMode=off
; 대상 모니터 기준 해상도
BaseWidth=1920
BaseHeight=1080
